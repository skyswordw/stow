# Builds Stow and runs StowTests on a GitHub-hosted Xcode 27 runner (macOS 27), ad-hoc signed.
# Guards against a "green" run that silently skipped the 7-Zip suites: the bundled 7zz must be in
# StowEngine.xpc, and scripts/ci-assert-tests.sh fails on any failed or skipped test.
name: CI

on:
  push:
    branches: [main]
  # Any base branch: wave-2 work is stacked on earlier PRs until they merge.
  pull_request:
  workflow_dispatch:
    inputs:
      intel-tests:
        description: Also run the test suite as x86_64 under Rosetta (slow)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      XCODE_APP: /Applications/Xcode_27.app
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode and print environment
        run: |
          sudo xcode-select -s "$XCODE_APP"
          sw_vers
          xcodebuild -version

      - name: Compute 7-Zip cache key
        id: sevenzip
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version=//p' scripts/fetch-7zip.sh)
          sha256=$(sed -n 's/^sha256=//p' scripts/fetch-7zip.sh)
          [[ "$version" =~ ^[0-9]+\.[0-9]+$ ]]
          [[ "$sha256" =~ ^[[:xdigit:]]{64}$ ]]
          echo "key=7zip-${{ runner.os }}-${{ runner.arch }}-${version}-${sha256}" >> "$GITHUB_OUTPUT"

      # Restore and save separately: a combined actions/cache only saves when the whole job passes.
      - id: cache-7zip
        uses: actions/cache/restore@v5
        with:
          path: Vendor/7zip
          key: ${{ steps.sevenzip.outputs.key }}

      - name: Fetch and verify 7-Zip
        run: |
          zsh scripts/fetch-7zip.sh
          test -f Vendor/7zip/7zz
          test -x Vendor/7zip/7zz
          Vendor/7zip/7zz i | head -3

      - if: steps.cache-7zip.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: Vendor/7zip
          key: ${{ steps.sevenzip.outputs.key }}

      - name: Generate Xcode project
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen generate

      - name: Record plist changes from xcodegen
        run: |
          mkdir -p build
          git diff -- '*.plist' > build/generated-plists.diff
          git diff --stat -- '*.plist'

      - name: Report who declares the system file types
        continue-on-error: true
        run: scripts/report-type-declarers.sh

      - name: Build and test
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild test \
            -project Stow.xcodeproj \
            -scheme Stow \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/Stow.xcresult \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM= \
            2>&1 | tee build/xcodebuild-test.log

      - name: Assert bundled 7-Zip
        if: ${{ !cancelled() }}
        run: |
          found=0
          while IFS= read -r binary; do
            test -x "$binary"
            echo "Verified executable: $binary"
            found=1
          done < <(find build/DerivedData -type f -path '*StowEngine.xpc/Contents/MacOS/7zz')
          if [[ "$found" != 1 ]]; then
            echo 'error: No executable 7zz found in StowEngine.xpc' >&2
            exit 1
          fi

      - name: Assert test results
        if: ${{ !cancelled() }}
        env:
          ALLOWED_SKIPS: "0"
          # The total this branch reports (341 after the accessibility pass). Raise it when tests are added;
          # a lower total means suites went missing.
          MIN_TESTS: "341"
        run: scripts/ci-assert-tests.sh build/Stow.xcresult

      - name: Every string has a Simplified Chinese translation
        if: ${{ !cancelled() }}
        run: scripts/check-localizations.sh zh-Hans

      - name: Committed plists match project.yml
        if: ${{ !cancelled() }}
        run: |
          if [[ -s build/generated-plists.diff ]]; then
            echo '::error::xcodegen changed committed plists; commit the regenerated files (generated-plists.diff in the test-results artifact)'
            exit 1
          fi

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results
          path: |
            build/Stow.xcresult
            build/*.log
            build/loc/missing-*.txt
            build/generated-plists.diff
          retention-days: 14

  # Universal 2 (#33): a Release build must carry arm64 and x86_64 in every binary, 7zz included.
  universal:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      XCODE_APP: /Applications/Xcode_27.app
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Compute 7-Zip cache key
        id: sevenzip
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version=//p' scripts/fetch-7zip.sh)
          sha256=$(sed -n 's/^sha256=//p' scripts/fetch-7zip.sh)
          echo "key=7zip-${{ runner.os }}-${{ runner.arch }}-${version}-${sha256}" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v5
        with:
          path: Vendor/7zip
          key: ${{ steps.sevenzip.outputs.key }}

      - name: Fetch 7-Zip and generate the project
        run: |
          zsh scripts/fetch-7zip.sh
          lipo -archs Vendor/7zip/7zz
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate

      - name: Build Release (generic macOS, all architectures)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild build \
            -project Stow.xcodeproj \
            -scheme Stow \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM= \
            2>&1 | tee build/xcodebuild-release.log | tail -40

      - name: Every binary is arm64 + x86_64
        run: scripts/check-universal.sh build/DerivedData/Build/Products/Release/Stow.app

      # #32/#34: the release packaging path on every PR, without secrets. Re-signs the Release build
      # ad-hoc inside-out, builds the DMG and runs scripts/verify-app-bundle.sh (sandbox on every
      # piece, no get-task-allow, codesign --verify --deep --strict, DMG layout).
      - name: Package dry run (ad-hoc DMG)
        run: |
          SIGN_IDENTITY=- PREBUILT_APP=build/DerivedData/Build/Products/Release/Stow.app \
            OUT_DIR=build/package-dry-run scripts/package.sh

      # Informational: Rosetta is not an Intel Mac. 7-Zip's x86_64 build picks code paths from CPUID,
      # and Rosetta doesn't run all of them, so a failure here is a warning; real Intel hardware is
      # ROADMAP Tests #16.
      - name: The Intel slices under Rosetta (informational)
        run: |
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "::warning::Rosetta is not installed on this runner; the x86_64 slices were checked but not run"
            exit 0
          fi
          sz=build/DerivedData/Build/Products/Release/Stow.app/Contents/XPCServices/StowEngine.xpc/Contents/MacOS/7zz
          work=$(mktemp -d)
          head -c 300000 /dev/urandom > "$work/noise.bin"
          seq 1 20000 > "$work/text.txt"
          Vendor/7zip/7zz a -bso0 "$work/arm.7z" "$work/text.txt" "$work/noise.bin"
          failed=()
          check() { # <label> <7zz arguments…>
            local label=$1; shift
            if arch -x86_64 "$sz" "$@" -bso0 -bse0 -bsp0 >/dev/null 2>&1; then echo "ok    $label"
            else local status=$?; echo "FAIL  $label (exit $status)"; failed+=("$label ($status)"); fi
          }
          check "start (7zz i)"      i
          check "list 7z"            l "$work/arm.7z"
          check "test 7z (LZMA2)"    t "$work/arm.7z"
          check "pack zip store"     a -tzip -mx0 "$work/s.zip" "$work/text.txt"
          check "pack zip deflate"   a -tzip -mx5 "$work/d.zip" "$work/text.txt"
          check "pack 7z one thread" a -t7z -mx5 -mmt1 "$work/m1.7z" "$work/text.txt"
          check "pack 7z LZMA2"      a -t7z -mx5 "$work/m.7z" "$work/text.txt" "$work/noise.bin"
          check "pack 7z AES"        a -t7z -pRosetta -mhe=on "$work/e.7z" "$work/text.txt"
          check "pack xz"            a -txz "$work/t.xz" "$work/text.txt"
          if (( ${#failed[@]} )); then
            echo "::warning::Under Rosetta the x86_64 7zz failed: ${failed[*]}. Rosetta doesn't emulate every instruction 7-Zip's x86_64 build may pick; confirm on a real Intel Mac (ROADMAP Tests #16)."
          fi

      - name: Test suite as x86_64 under Rosetta
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.intel-tests }}
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild test \
            -project Stow.xcodeproj \
            -scheme Stow \
            -destination 'platform=macOS,arch=x86_64' \
            -derivedDataPath build/DerivedData-x86_64 \
            -resultBundlePath build/Stow-x86_64.xcresult \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM= \
            2>&1 | tee build/xcodebuild-test-x86_64.log | tail -60
          ALLOWED_SKIPS=0 MIN_TESTS=1 scripts/ci-assert-tests.sh build/Stow-x86_64.xcresult

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: universal-build
          path: |
            build/*.log
            build/Stow-x86_64.xcresult
            build/package-dry-run/*.dmg
          retention-days: 14


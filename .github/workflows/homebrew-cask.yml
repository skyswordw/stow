# Homebrew cask (#36). Renders packaging/homebrew/stow.rb with the version and DMG checksum of a
# release, audits it, installs and uninstalls it once, uploads the cask as an artifact, and — on
# release:published / workflow_dispatch — commits Casks/stow.rb to Beastry/homebrew-tap when
# HOMEBREW_TAP_TOKEN is set. Draft releases never run this workflow (only published).
# On pull requests it checks the template with a stand-in DMG (style + offline audit only).
name: Homebrew cask

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v (e.g. 1.0.0); the release must have Stow-<version>.dmg
        required: true
  pull_request:
    paths:
      - "packaging/homebrew/**"
      - "scripts/render-cask.sh"
      - ".github/workflows/homebrew-cask.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cask:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      # brew audit/install call the GitHub API; unauthenticated requests hit the 60/hour limit.
      HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Render the cask
        id: render
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            release) version=${RELEASE_TAG#v}; scripts/render-cask.sh "$version" --repo "$GITHUB_REPOSITORY" ;;
            workflow_dispatch) version=${INPUT_VERSION#v}; scripts/render-cask.sh "$version" --repo "$GITHUB_REPOSITORY" ;;
            *)
              # No release exists yet (signing and the release DMG are #32/#34): a stand-in disk
              # image proves the template renders; nothing is downloaded or installed.
              version=0.1.0
              mkdir -p build
              mkdir -p build/dmg-src/Stow.app/Contents
              hdiutil create -quiet -srcfolder build/dmg-src -volname Stow -format UDZO -ov build/Stow-$version.dmg
              scripts/render-cask.sh "$version" --dmg build/Stow-$version.dmg
              ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          cat build/homebrew/stow.rb

      - name: Audit in a scratch tap
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          brew tap-new --no-git stow-ci/local
          tap=$(brew --repository stow-ci/local)
          mkdir -p "$tap/Casks"
          cp build/homebrew/stow.rb "$tap/Casks/stow.rb"
          # Homebrew 6 requires explicit trust before loading this generated cask for audit.
          brew trust --cask stow-ci/local/stow
          brew style --cask stow-ci/local/stow
          if [[ "$EVENT" == pull_request ]]; then
            brew audit --cask stow-ci/local/stow
          else
            brew audit --cask --online stow-ci/local/stow
          fi

      - name: Install and uninstall once
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail
          brew install --cask stow-ci/local/stow
          test -d /Applications/Stow.app
          codesign --verify --deep --strict /Applications/Stow.app
          brew uninstall --cask --zap stow-ci/local/stow
          test ! -e /Applications/Stow.app

      - name: Summary
        if: always()
        run: |
          {
            echo "### Rendered cask (version ${{ steps.render.outputs.version }})"
            echo
            echo '```ruby'
            cat build/homebrew/stow.rb 2>/dev/null || echo "(not rendered)"
            echo '```'
            echo
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              echo "PR check only — no tap push."
            else
              echo "On success the next step commits \`Casks/stow.rb\` to [Beastry/homebrew-tap](https://github.com/Beastry/homebrew-tap) (\`brew install --cask Beastry/tap/stow\`)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: homebrew-cask
          path: build/homebrew/stow.rb
          retention-days: 30

      # GITHUB_TOKEN cannot write other repos; a fine-grained PAT scoped to Beastry/homebrew-tap
      # (Contents: Read and write) is required. See RELEASING.md → Homebrew tap.
      - name: Push cask to Beastry/homebrew-tap
        if: ${{ github.event_name != 'pull_request' }}
        id: push
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.render.outputs.version }}
          TAP_REPO: Beastry/homebrew-tap
        run: |
          set -euo pipefail
          if [[ -z "${HOMEBREW_TAP_TOKEN:-}" ]]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not set on Beastry/stow. Create a fine-grained PAT with Contents: Read and write on Beastry/homebrew-tap only, then: gh secret set HOMEBREW_TAP_TOKEN -R Beastry/stow. See RELEASING.md."
            exit 1
          fi
          tap_dir=$(mktemp -d)
          trap 'rm -rf "$tap_dir"' EXIT
          # x-access-token form; token never printed.
          git clone --depth=1 "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${TAP_REPO}.git" "$tap_dir"
          mkdir -p "$tap_dir/Casks"
          cp build/homebrew/stow.rb "$tap_dir/Casks/stow.rb"
          cd "$tap_dir"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/stow.rb
          if git diff --cached --quiet; then
            echo "Casks/stow.rb already matches version $VERSION — nothing to push."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "stow ${VERSION}"
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "Pushed Casks/stow.rb (${VERSION}) to ${TAP_REPO}"

# Renders demo scenes with scripts/snapshot.sh on the hosted Xcode 27 runner and uploads the
# light and dark window images as an artifact, for design review of a PR. Not a test gate.
name: Snapshots

on:
  pull_request:
    paths:
      - "App/**"
      - "Preview/**"
      - "project.yml"
      - "scripts/snapshot.sh"
      - ".github/workflows/snapshots.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshots:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      XCODE_APP: /Applications/Xcode_27.app
      PANES: general extraction installing packing previews passwords fileTypes integration advanced licenses
      # Other demo scenes (App/DemoScene.swift), for the layout check in every language.
      SCENES: editing external readonly onboarding grid list search activity pack pack-zst password cloud-download batch conflict conflict-folder signature-warning replace-app tray checkup-format glance open-damaged extract-damaged
      LANGS: en zh-Hans
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Compute 7-Zip cache key
        id: sevenzip
        shell: bash
        run: |
          version=$(sed -n 's/^version=//p' scripts/fetch-7zip.sh)
          sha256=$(sed -n 's/^sha256=//p' scripts/fetch-7zip.sh)
          echo "key=7zip-${{ runner.os }}-${{ runner.arch }}-${version}-${sha256}" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v5
        with:
          path: Vendor/7zip
          key: ${{ steps.sevenzip.outputs.key }}

      - name: Fetch 7-Zip and generate the project
        run: |
          zsh scripts/fetch-7zip.sh
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate
          mkdir -p shots
          # Generated files that are committed (App/Info.plist …) should match project.yml.
          git diff -- '*.plist' > shots/generated-plists.diff
          git diff --stat -- '*.plist'

      - name: Build Stow (Debug, ad-hoc)
        run: |
          set -o pipefail
          xcodebuild build -project Stow.xcodeproj -scheme Stow -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath build \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM= | tail -20

      - name: Snapshot Settings panes and scenes, light and dark, every language
        run: |
          typeset -a missing
          shoot() { # <out-name> <scene> <look> <lang> [args…]
            local out=$1 scene=$2 look=$3 lang=$4; shift 4
            rm -f snapshots/$scene-*.png
            zsh scripts/snapshot.sh "$scene" "$look" "" -AppleLanguages "($lang)" "$@" || echo "::warning::$out $look $lang failed"
            # A scene that renders nothing (a crash, a hang) must not pass as green: retry once, then fail.
            if [[ -z $(print -l snapshots/$scene-*.png(N)) ]]; then
              zsh scripts/snapshot.sh "$scene" "$look" "" -AppleLanguages "($lang)" "$@" || true
            fi
            if [[ -z $(print -l snapshots/$scene-*.png(N)) ]]; then
              echo "::error::$out $look $lang produced no image"; missing+=("$lang/$out-$look")
            fi
            for file in snapshots/$scene-*.png(N); do
              mv "$file" "shots/$lang/$out-$look-${${file:t}#$scene-$look-}"
            done
          }
          for lang in ${=LANGS}; do
            mkdir -p shots/$lang
            for look in light dark; do
              for pane in ${=PANES}; do shoot "settings-$pane" settings $look $lang -StowSettingsPane $pane; done
              for scene in ${=SCENES}; do shoot "$scene" $scene $look $lang; done
            done
          done
          find shots -name '*.png' | wc -l
          (( ${#missing} == 0 )) || { echo "Missing: ${missing[*]}"; exit 1; }
        shell: zsh {0}

      - name: Collect crash reports
        if: always()
        run: |
          mkdir -p shots/crashes
          cp ~/Library/Logs/DiagnosticReports/Stow*.ips shots/crashes/ 2>/dev/null || true
          ls shots/crashes

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: snapshots
          path: shots
          retention-days: 14

name: Stow
options:
  bundleIdPrefix: app.stow
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: "-"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Stow:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: ["Info.plist", "*.entitlements"]
      - path: Shared
      - path: Preview
      - path: Handoff
      - path: LICENSE
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    dependencies:
      - target: StowEngine
      - target: StowQuickLook
      - target: StowFinderSync
    # Merged with the generated Info.plist. Every type here mirrors Shared/ArchiveTypes.swift
    # (a test checks); the second document type is Alternate so Stow never takes over disk images
    # or installers unless people choose it in File Types.
    info:
      path: App/Info.plist
      properties:
        # Only ever carries a one-time token from the Finder extension — see Handoff/Handoff.swift.
        CFBundleURLTypes:
          - CFBundleURLName: app.stow.handoff
            CFBundleURLSchemes: [stow]
        # Services menu (App/Integration/ServicesProvider.swift). NSRequiredContext makes them
        # appear without people turning them on in Keyboard settings first.
        NSServices:
          - NSMenuItem: {default: "Stow: Extract Here"}
            NSMessage: extractHere
            NSPortName: Stow
            NSRequiredContext: {}
            NSSendFileTypes: [public.archive]
          - NSMenuItem: {default: "Stow: Extract To…"}
            NSMessage: extractTo
            NSPortName: Stow
            NSRequiredContext: {}
            NSSendFileTypes: [public.archive]
          - NSMenuItem: {default: "Stow: Quick Compress"}
            NSMessage: quickCompress
            NSPortName: Stow
            NSRequiredContext: {}
            NSSendFileTypes: [public.item]
          - NSMenuItem: {default: "Stow: Compress…"}
            NSMessage: compress
            NSPortName: Stow
            NSRequiredContext: {}
            NSSendFileTypes: [public.item]
          - NSMenuItem: {default: "Send to Stow"}
            NSMessage: sendToStow
            NSPortName: Stow
            NSRequiredContext: {}
            NSSendFileTypes: [public.item]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes: [public.zip-archive, com.winzip.zipx-archive, org.7-zip.7-zip-archive, com.rarlab.rar-archive, app.stow.split-archive, public.tar-archive, org.gnu.gnu-zip-tar-archive, public.tar-bzip2-archive, org.tukaani.tar-xz-archive, org.gnu.gnu-zip-archive, public.bzip2-archive, org.tukaani.xz-archive, org.tukaani.lzma-archive, public.lzip-archive, public.z-archive, app.stow.zstd-archive, public.cpio-archive, com.microsoft.cab, app.stow.arj-archive, cx.c3.lha-archive, app.stow.cbz-archive, app.stow.cbr-archive, app.stow.cb7-archive]
          - CFBundleTypeName: Disk image or package
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.apple.disk-image-udif, public.iso-image, app.stow.wim-image, app.stow.vhd-image, com.apple.xar-archive, com.apple.installer-package-archive, com.redhat.rpm-archive, app.stow.deb-archive, app.stow.msi-installer, com.sun.java-archive, public.archive.apk]
        UTImportedTypeDeclarations:
          # macOS itself doesn't declare RAR; without this the type only resolves when some other
          # app happens to import it, so on a clean Mac Stow can't become RAR's default app.
          - UTTypeIdentifier: com.rarlab.rar-archive
            UTTypeDescription: RAR archive
            UTTypeConformsTo: [public.archive, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [rar]
              public.mime-type: [application/vnd.rar, application/x-rar-compressed, application/x-rar]
          - UTTypeIdentifier: app.stow.split-archive
            UTTypeDescription: Split archive part
            UTTypeConformsTo: [public.archive, public.data]
            UTTypeTagSpecification:
              public.filename-extension: ["001"]
          - UTTypeIdentifier: app.stow.zstd-archive
            UTTypeDescription: Zstandard file
            UTTypeConformsTo: [public.archive, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [zst, tzst]
          - UTTypeIdentifier: app.stow.arj-archive
            UTTypeDescription: ARJ archive
            UTTypeConformsTo: [public.archive, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [arj]
          - UTTypeIdentifier: app.stow.cbz-archive
            UTTypeDescription: Comic book (ZIP)
            UTTypeConformsTo: [public.zip-archive, public.archive, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [cbz]
          - UTTypeIdentifier: app.stow.cbr-archive
            UTTypeDescription: Comic book (RAR)
            UTTypeConformsTo: [com.rarlab.rar-archive, public.archive, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [cbr]
          - UTTypeIdentifier: app.stow.cb7-archive
            UTTypeDescription: Comic book (7Z)
            UTTypeConformsTo: [org.7-zip.7-zip-archive, public.archive, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [cb7]
          - UTTypeIdentifier: app.stow.wim-image
            UTTypeDescription: Windows image
            UTTypeConformsTo: [public.archive, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [wim]
          - UTTypeIdentifier: app.stow.vhd-image
            UTTypeDescription: Virtual hard disk
            UTTypeConformsTo: [public.archive, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [vhd]
          - UTTypeIdentifier: app.stow.deb-archive
            UTTypeDescription: Debian package
            UTTypeConformsTo: [public.archive, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [deb]
          - UTTypeIdentifier: app.stow.msi-installer
            UTTypeDescription: Windows installer
            UTTypeConformsTo: [public.archive, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [msi]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.stow.Stow
        PRODUCT_NAME: Stow
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Stow
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        ENABLE_USER_SELECTED_FILES: readwrite
        CODE_SIGN_ENTITLEMENTS: App/Stow.entitlements
  # Sandboxed XPC service that parses every archive. It has no file access of its own: Stow passes
  # the archive and a staging folder as URLs, and their sandbox extensions travel with them.
  StowEngine:
    type: xpc-service
    platform: macOS
    sources:
      - path: Engine
        excludes: ["*.entitlements", "Info.plist"]
      - path: Shared
    info:
      path: Engine/Info.plist
      properties:
        CFBundleDisplayName: Stow Engine
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        XPCService:
          ServiceType: Application
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.stow.Stow.Engine
        PRODUCT_NAME: StowEngine
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        SKIP_INSTALL: YES
        # codesign writes a temp file beside 7zz and reads the bundle's Info.plist.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      # 7-Zip (LGPL) ships as its own unmodified executable — see THIRD_PARTY_NOTICES.md.
      - name: Embed 7-Zip
        inputFiles:
          - $(SRCROOT)/Vendor/7zip/7zz
          - $(SRCROOT)/Vendor/7zip/License.txt
          - $(SRCROOT)/Engine/7zz.entitlements
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_FOLDER_PATH)/7zz
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/7-Zip-License.txt
        script: |
          set -e
          if [ ! -x "${SCRIPT_INPUT_FILE_0}" ]; then
            echo "error: 7-Zip is missing. Run scripts/fetch-7zip.sh first."
            exit 1
          fi
          mkdir -p "$(dirname "${SCRIPT_OUTPUT_FILE_0}")" "$(dirname "${SCRIPT_OUTPUT_FILE_1}")"
          cp -f "${SCRIPT_INPUT_FILE_0}" "${SCRIPT_OUTPUT_FILE_0}"
          cp -f "${SCRIPT_INPUT_FILE_1}" "${SCRIPT_OUTPUT_FILE_1}"
          codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" --options runtime \
            --entitlements "${SCRIPT_INPUT_FILE_2}" "${SCRIPT_OUTPUT_FILE_0}"
  # Quick Look preview for archives in Finder. Lists (never extracts) through its own copy of the
  # engine: Quick Look extensions may not launch processes, and can't reach the app's XPC services.
  StowQuickLook:
    type: app-extension
    platform: macOS
    sources:
      - path: QuickLook
        excludes: ["Info.plist"]
      - path: Preview
      - path: Shared
      - path: App/Model/Archive.swift
      - path: App/Model/Checkup.swift
      - path: App/Model/NameEncoding.swift
      - path: App/Model/SearchIndex.swift
      - path: App/Model/DiskImage.swift
      - path: App/Engine/ArchiveEngine.swift
    dependencies:
      - target: StowEngine
        embed: true
        copy:
          destination: wrapper
          subpath: Contents/XPCServices
    info:
      path: QuickLook/Info.plist
      properties:
        CFBundleDisplayName: Stow Quick Look
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLIsDataBasedPreview: false
            QLSupportsSearchableItems: false
            QLSupportedContentTypes: [public.zip-archive, com.winzip.zipx-archive, org.7-zip.7-zip-archive, com.rarlab.rar-archive, app.stow.split-archive, public.tar-archive, org.gnu.gnu-zip-tar-archive, public.tar-bzip2-archive, org.tukaani.tar-xz-archive, org.gnu.gnu-zip-archive, public.bzip2-archive, org.tukaani.xz-archive, org.tukaani.lzma-archive, public.lzip-archive, public.z-archive, app.stow.zstd-archive, public.cpio-archive, com.microsoft.cab, app.stow.arj-archive, cx.c3.lha-archive, app.stow.cbz-archive, app.stow.cbr-archive, app.stow.cb7-archive, com.apple.disk-image-udif, public.iso-image, app.stow.wim-image, app.stow.vhd-image, com.apple.xar-archive, com.apple.installer-package-archive, com.redhat.rpm-archive, app.stow.deb-archive, app.stow.msi-installer, com.sun.java-archive, public.archive.apk]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.stow.Stow.QuickLook
        PRODUCT_NAME: StowQuickLook
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        SKIP_INSTALL: YES
  # Finder context menu. Sees only the selection's paths; hands them to Stow under a one-time
  # token (Handoff/) and never opens the files itself.
  StowFinderSync:
    type: app-extension
    platform: macOS
    sources:
      - path: FinderSync
        excludes: ["Info.plist"]
      - path: Handoff
      - path: Shared/ArchiveTypes.swift
    info:
      path: FinderSync/Info.plist
      properties:
        CFBundleDisplayName: Stow Finder Extension
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.FinderSync
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FinderSync
          NSExtensionAttributes: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.stow.Stow.FinderSync
        PRODUCT_NAME: StowFinderSync
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        SKIP_INSTALL: YES
  StowTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
        excludes: ["Fixtures"]
      # Disk images built by scripts/make-fixtures.sh (hdiutil can't run in the sandboxed test host).
      - path: Tests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: Stow
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.stow.StowTests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Stow.app/Contents/MacOS/Stow
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Stow:
    build:
      targets:
        Stow: all
        StowTests: [test]
    test:
      targets:
        - StowTests
